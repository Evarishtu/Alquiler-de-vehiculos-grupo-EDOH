<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Crear alquiler</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
  <h1>Zona Cliente - AlquilaTusVehiculos</h1>
  <div class="menu">
    <a th:href="@{/user}">Inicio</a>
    <a th:href="@{/user/vehiculos}">Vehículos disponibles</a>
    <a th:href="@{/user/alquileres}">Mi alquiler</a>

    <form th:action="@{/logout}" method="post" class="logout-form">
      <button type="submit" class="logout-link">Cerrar sesión</button>
    </form>
  </div>
</div>

<div class="container">
  <h2>Confirmar alquiler</h2>

  <div class="form-container">
    <form th:action="@{/user/alquileres/guardar}" th:object="${alquiler}" method="post">
      <input type="hidden" name="vehiculoId" th:value="${vehiculo.id}">

      <p><strong>Vehículo:</strong>
        <span th:text="${vehiculo.marca + ' ' + vehiculo.modelo}"></span>
      </p>

      <p><strong>Matrícula:</strong>
        <span th:text="${vehiculo.matricula}"></span>
      </p>

      <p><strong>Precio por día:</strong>
        <span th:text="${vehiculo.precioPorDia} + ' €'"></span>
      </p>

      <label>Fecha inicio</label>
      <input type="date" th:field="*{fechaInicio}" required>

      <label>Fecha fin</label>
      <input type="date" th:field="*{fechaFin}" required>

      <button type="submit" class="boton">Confirmar alquiler</button>
    </form>
  </div>

  <div class="boton-container">
    <a th:href="@{/user/vehiculos}" class="boton">Volver</a>
  </div>
</div>

</body>
</html>
