<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehículos disponibles</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <h1>Zona Cliente - AlquilaTusVehiculos</h1>
    <div class="menu">
        <a th:href="@{/user}">Inicio</a>
        <a th:href="@{/user/vehiculos}">Vehículos disponibles</a>
        <a th:href="@{/user/alquileres}">Mi alquiler</a>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-link">Cerrar sesión</button>
        </form>
    </div>
</div>

<div class="container">
    <h2>Vehículos disponibles</h2>

    <div class="tabla-container">
        <table>
            <thead>
            <tr>
                <th>Matrícula</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Precio por día</th>
                <th>Disponible</th>
                <th>Alquilar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td th:text="${vehiculo.matricula}"></td>
                <td th:text="${vehiculo.marca}"></td>
                <td th:text="${vehiculo.modelo}"></td>
                <td th:text="${vehiculo.precioPorDia} + ' €'"></td>
                <td>Disponible</td>
                <td>
                    <a th:href="@{/user/alquileres/nuevo/{id}(id=${vehiculo.id})}" class="boton">
                        Alquilar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
