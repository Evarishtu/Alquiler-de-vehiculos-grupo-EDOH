<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Alquiler</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <h1>AlquilaTusVehiculos</h1>
</div>

<div class="container">
    <h2>Crear Alquiler</h2>

    <form th:action="@{/alquileres/guardar}" th:object="${alquiler}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Cliente</label>
        <select name="cliente.id">
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.id}"
                    th:text="${cliente.nombre}">
            </option>
        </select><br>

        <label>Vehículo</label>
        <select name="vehiculo.id">
            <option th:each="vehiculo : ${vehiculos}"
                    th:value="${vehiculo.id}"
                    th:text="${vehiculo.matricula}">
            </option>
        </select><br>

        <label>Fecha inicio</label>
        <input type="date" th:field="*{fechaInicio}">

        <label>Fecha fin</label>
        <input type="date" th:field="*{fechaFin}">

        <button type="submit" class="boton">Guardar</button>
    </form>

    <br>
    <a th:href="@{/alquileres}" class="boton">Volver</a>
</div>

</body>
</html>
