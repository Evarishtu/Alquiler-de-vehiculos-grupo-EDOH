<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alquileres</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="menu">
    AlquilaTusVehiculos
    <br>
    <a href="/">Inicio</a> |
    <a href="/clientes">Clientes</a> |
    <a href="/vehiculos">Vehículos</a> |
    <a href="/alquileres">Alquileres</a>

</div>

<h1>Alquileres</h1>

<a href="/alquileres/nuevo">Nuevo alquiler</a>

<table border="1">
    <tr>
        <th>Cliente</th>
        <th>Vehiculo</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
        <th>Eliminar</th>
    </tr>

    <tr th:each="alquiler : ${alquileres}">
        <td th:text="${alquiler.cliente.nombre}"></td>
        <td th:text="${alquiler.vehiculo.matricula}"></td>
        <td th:text="${alquiler.fechaInicio}"></td>
        <td th:text="${alquiler.fechaFin}"></td>
        <td>
            <a th:href="@{/alquileres/eliminar/{id}(id=${alquiler.id})}">Eliminar</a>
        </td>
    </tr>

</table>

</body>
</html>
