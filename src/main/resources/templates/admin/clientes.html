<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <h1>Panel Admin - AlquilaTusVehiculos</h1>
    <div class="menu">
        <a th:href="@{/admin}">Inicio</a>
        <a th:href="@{/admin/clientes}">Clientes</a>
        <a th:href="@{/admin/vehiculos}">Vehículos</a>
        <a th:href="@{/admin/alquileres}">Alquileres</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-link">Cerrar sesión</button>
        </form>
    </div>
</div>

<div class="container">
    <h2>Clientes</h2>

    <div class="boton-container">
        <a th:href="@{/admin/clientes/nuevo}" class="boton">Nuevo cliente</a>
    </div>

    <div class="tabla-container">
        <table>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Editar</th>
                <th>Eliminar</th>
            </tr>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.nombre}"></td>
                <td th:text="${cliente.email}"></td>
                <td>
                    <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.id})}" class="boton-editar">
                        Editar
                    </a>
                </td>
                <td>
                    <a th:href="@{/admin/clientes/eliminar/{id}(id=${cliente.id})}" class="boton-eliminar">
                        Eliminar
                    </a>
                </td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
