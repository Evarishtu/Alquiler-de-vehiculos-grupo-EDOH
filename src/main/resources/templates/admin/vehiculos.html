<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehículos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="navbar">
    <h1>Panel Admin - AlquilaTusVehiculos</h1>
    <div class="menu">
        <a th:href="@{/admin}">Inicio</a>
        <a th:href="@{/admin/clientes}">Clientes</a>
        <a th:href="@{/admin/vehiculos}">Vehículos</a>
        <a th:href="@{/admin/alquileres}">Alquileres</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-link">Cerrar sesión</button>
        </form>
    </div>
</div>

<div class="container">
    <h2>Vehículos</h2>

    <div class="boton-container">
        <a th:href="@{/admin/vehiculos/nuevo}" class="boton">Nuevo vehículo</a>
    </div>

    <div class="tabla-container">
        <table>
            <thead>
            <tr>
                <th>Matrícula</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Precio</th>
                <th>Disponible</th>
                <th>Editar</th>
                <th>Eliminar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td th:text="${vehiculo.matricula}"></td>
                <td th:text="${vehiculo.marca}"></td>
                <td th:text="${vehiculo.modelo}"></td>
                <td th:text="${vehiculo.precioPorDia} + ' €'"></td>
                <td th:text="${vehiculo.disponible}"></td>
                <td>
                    <a th:href="@{/admin/vehiculos/editar/{id}(id=${vehiculo.id})}" class="boton-editar">
                        Editar
                    </a>
                </td>
                <td>
                    <a th:href="@{/admin/vehiculos/eliminar/{id}(id=${vehiculo.id})}" class="boton-eliminar">
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
